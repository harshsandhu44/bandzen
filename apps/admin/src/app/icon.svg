<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Bandzen mark: band 9 over the scale tick. The 9 is a Geist SemiBold outline, not a font reference — a favicon cannot load a font.
       Regenerate rather than hand-editing the path.

       Identical to apps/app and apps/web except the tick, which is plum here
       rather than gold. That is the same substitution globals.css makes to
       the tick token, and for the same reason: it is what makes the lockup read
       as the CMS at a glance. The plum token's own note calls a favicon out as the
       place hue 305 has to be unmistakable, and this is that place — a CMS tab
       sits next to an app tab all day.

       Plum is #b474f4 here, the .dark value of the plum token rather than the
       :root one. The ground is #09090f, so the lifted ramp is the one that stays
       legible; the darker :root plum disappears into it. -->
  <rect width="32" height="32" fill="#09090f"/>
  <path fill="#ffffff" transform="translate(7.21 24) scale(0.028926 -0.028926)" d="M284 -16Q189 -16 130.0 28.5Q71 73 47 152L175 160Q198 96 284 96Q356 96 395.5 145.5Q435 195 442 306V310Q385 229 272 229Q202 229 149.0 259.5Q96 290 66.0 344.0Q36 398 36 471Q36 549 69.0 606.5Q102 664 160.5 695.0Q219 726 296 726Q437 726 504.5 636.0Q572 546 572 385Q572 263 542.5 173.0Q513 83 450.0 33.5Q387 -16 284 -16ZM296 331Q358 331 396.0 368.0Q434 405 434 471Q434 536 398.0 576.5Q362 617 299 617Q238 617 203.0 577.5Q168 538 168 472Q168 407 203.0 369.0Q238 331 296 331Z"/>
  <rect x="9.5" y="26.5" width="13" height="3" fill="#b474f4"/>
